name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = (Select-String -Path app/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match app/Cargo.toml version $version" }
      - run: cargo test
        working-directory: app
      - run: cargo build --release
        working-directory: app
      - name: Package
        run: |
          $out = "openray"
          New-Item -ItemType Directory "$out/extensions/spotify-player" -Force | Out-Null
          Copy-Item app/target/release/openray.exe $out
          Copy-Item extensions/spotify-player/dist/* "$out/extensions/spotify-player"
          Copy-Item LICENSE $out
          Compress-Archive -Path "$out/*" -DestinationPath openray-windows-x64.zip
      - name: Installer
        run: |
          $version = (Select-String -Path app/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE) { throw "Installing NSIS failed" }
          }
          & $makensis /V2 "/DVERSION=$version" "/DSOURCE=$PWD\openray" "/DOUTFILE=$PWD\openray-windows-x64-setup.exe" installer/openray.nsi
          if ($LASTEXITCODE) { throw "makensis failed" }
      - name: Sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx --yes @tauri-apps/cli@2.12.3 signer sign openray-windows-x64.zip
          if ($LASTEXITCODE) { throw "Signing the zip failed" }
          npx --yes @tauri-apps/cli@2.12.3 signer sign openray-windows-x64-setup.exe
          if ($LASTEXITCODE) { throw "Signing the installer failed" }
      - name: Update manifest
        run: |
          $version = (Select-String -Path app/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $manifest = [ordered]@{
            version = $version
            url = "https://github.com/${{ github.repository }}/releases/download/v$version/openray-windows-x64.zip"
            signature = (Get-Content openray-windows-x64.zip.sig -Raw).Trim()
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                url = "https://github.com/${{ github.repository }}/releases/download/v$version/openray-windows-x64-setup.exe"
                signature = (Get-Content openray-windows-x64-setup.exe.sig -Raw).Trim()
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content latest.json -Encoding utf8NoBOM
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" openray-windows-x64.zip openray-windows-x64.zip.sig openray-windows-x64-setup.exe openray-windows-x64-setup.exe.sig latest.json --title "Openray ${{ github.ref_name }}" --notes "See the commits since the previous release."
