name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo test
        working-directory: app
      - run: cargo build --release
        working-directory: app
      - name: Package
        run: |
          $out = "openray"
          New-Item -ItemType Directory "$out/extensions/spotify-player" -Force | Out-Null
          Copy-Item app/target/release/openray.exe $out
          Copy-Item extensions/spotify-player/dist/* "$out/extensions/spotify-player"
          Copy-Item LICENSE $out
          Compress-Archive -Path "$out/*" -DestinationPath openray-windows-x64.zip
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" openray-windows-x64.zip --title "Openray ${{ github.ref_name }}" --notes "See the commits since the previous release."
