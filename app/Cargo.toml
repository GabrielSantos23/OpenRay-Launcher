[package]
name = "openray-native"
version = "0.1.36"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[[bin]]
name = "openray"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit", "clipboard", "default_fonts", "links"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["svg"] }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
png = "0.17"
raw-window-handle = "0.6"
windows-core = "0.61"
tray-icon = "0.26"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
rqrr = { version = "0.11", default-features = false }
windows = { version = "0.61", features = [
  "ApplicationModel_Appointments",
  "ApplicationModel_Contacts",
  "Devices_Geolocation",
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Security_Cryptography",
  "Storage_Streams",
  "UI",
  "Media_Control",
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_DataExchange",
  "Win32_System_Environment",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_Globalization",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
regex = "1"
rquickjs = { version = "0.14", features = ["loader"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "charset", "form"] }
tokio = { version = "1", features = ["net", "sync", "time", "rt-multi-thread"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
minisign-verify = "0.2"

[dev-dependencies]
minisign = "0.7"
tempfile = "3"
